# 개발자용 Alembic CLI 설정 (서버는 이 파일을 안 읽는다 — kukie_agent/store/db.py 가 코드로 같은 설정을 만든다).
#   새 리비전 만드는 법은 README 「DB 표 모양을 바꿀 때」
#   DB 주소는 kukie_agent.store.db.database_url() 과 같은 규칙 — KUKIE_DATABASE_URL 이 없으면 ~/.kukie/kukie.db
[alembic]
prepend_sys_path = %(here)s
script_location = %(here)s/kukie_agent/store/migrations
file_template = %%(rev)s_%%(slug)s
