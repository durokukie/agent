# 개발자용 Alembic CLI 설정 (서버는 이 파일을 안 읽는다 — kukie/store/db.py 가 코드로 같은 설정을 만든다).
#   새 리비전:  KUKIE_DATABASE_URL=sqlite:////tmp/fresh.db alembic upgrade head && alembic revision --autogenerate -m "무엇을 바꿨나"
#   DB 주소는 kukie.store.db.database_url() 과 같은 규칙 — KUKIE_DATABASE_URL 이 없으면 ~/.kukie/kukie.db
[alembic]
prepend_sys_path = %(here)s
script_location = %(here)s/kukie/store/migrations
file_template = %%(rev)s_%%(slug)s
