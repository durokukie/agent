# PR 자동 리뷰 — CodeRabbit 대체 (Free 플랜은 요약만 하고 줄 단위 지적을 안 한다).
#
# 인증: 리뷰 전에 쓸 수 있는 길을 하나 골라 그것으로만 돌린다 (2026-11-13). 돌리다 실패하면 넘어가는 방식이 아니다 —
#       중간에 끊기면 코멘트가 반쯤 달리고 돈이 두 번 나간다.
#         1. OpenRouter (OPENROUTER_API_KEY) — 계정 잔액이 OPENROUTER_MIN_USD 이상일 때. 잔액 조회는 무료다
#         2. Amazon Bedrock (AWS_BEARER_TOKEN_BEDROCK) — 주 모델을 토큰 1개로 시험 호출해 200 이 오면
#         3. Claude 구독 토큰 (CLAUDE_CODE_OAUTH_TOKEN)
#       Bedrock 리전·모델 ID 는 레포 변수(BEDROCK_REGION · BEDROCK_OPUS_MODEL · BEDROCK_SONNET_MODEL · BEDROCK_HAIKU_MODEL).
#       고른 길은 'Pick model provider' 단계 로그에 한 줄로 남는다. 시크릿은 레포마다 따로 등록한다.
# 코멘트 게시: Claude GitHub App (https://github.com/apps/claude) 이 레포에 설치돼 있어야 한다.
#       `id-token: write` 는 그 App 토큰을 받기 위한 권한.
#
# 리뷰 본체는 Claude Code 의 code-review 플러그인 — /code-review 를 터미널에서 치는 것과 같다.
# --comment 로 인라인 코멘트를 단다.
name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore:               # 문서만 바뀐 PR 은 건너뛴다 — 요금 절약
      - "docs/**"
      - "**/*.md"

# 같은 PR 에 연달아 푸시하면 앞 리뷰를 취소한다 — 요금 낭비 방지
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Pick model provider
        id: pick
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MIN_USD: "5"
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          BEDROCK_REGION: ${{ vars.BEDROCK_REGION }}
          BEDROCK_MODEL: ${{ vars.BEDROCK_OPUS_MODEL }}
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          pick() { echo "provider=$1" >> "$GITHUB_OUTPUT"; echo "리뷰 경로: $1 ($2)"; exit 0; }
          if [ -n "$OPENROUTER_API_KEY" ]; then
            left=$(curl -sf --max-time 10 https://openrouter.ai/api/v1/credits \
              -H "Authorization: Bearer $OPENROUTER_API_KEY" | jq -r '.data.total_credits - .data.total_usage' || true)
            if [ -n "$left" ] && awk -v l="$left" -v m="$OPENROUTER_MIN_USD" 'BEGIN { exit !(l >= m) }'; then
              pick openrouter "잔액 \$$left"
            fi
            echo "OpenRouter 건너뜀 — 잔액 ${left:-확인 실패}, 기준 \$$OPENROUTER_MIN_USD"
          fi
          if [ -n "$AWS_BEARER_TOKEN_BEDROCK" ] && [ -n "$BEDROCK_REGION" ] && [ -n "$BEDROCK_MODEL" ]; then
            model=$(jq -rn --arg m "$BEDROCK_MODEL" '$m | @uri')
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST \
              "https://bedrock-runtime.$BEDROCK_REGION.amazonaws.com/model/$model/converse" \
              -H "Authorization: Bearer $AWS_BEARER_TOKEN_BEDROCK" -H 'Content-Type: application/json' \
              -d '{"messages":[{"role":"user","content":[{"text":"ok"}]}],"inferenceConfig":{"maxTokens":1}}' || true)
            [ "$code" = 200 ] && pick bedrock "$BEDROCK_MODEL"
            echo "Bedrock 건너뜀 — 시험 호출 HTTP ${code:-실패}"
          fi
          [ "$HAS_OAUTH" = true ] && pick oauth "구독 토큰"
          echo "::error::쓸 수 있는 길이 없다 — OpenRouter 충전, Bedrock 키·모델 접근, CLAUDE_CODE_OAUTH_TOKEN 중 하나가 필요하다"
          exit 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          # 워크어라운드 (https://github.com/anthropics/claude-code-action/issues/1646):
          # code-review 플러그인이 리뷰를 백그라운드 에이전트로 돌리면 Action 이 완료 전에
          # 세션을 닫아 리뷰가 유실된다. 포그라운드 실행을 강제한다.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: 1
          # 고른 길(pick)의 값만 채운다. 빈 값은 액션이 넘기지 않는 것과 같다
          ANTHROPIC_BASE_URL: ${{ steps.pick.outputs.provider == 'openrouter' && 'https://openrouter.ai/api' || '' }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ steps.pick.outputs.provider == 'bedrock' && secrets.AWS_BEARER_TOKEN_BEDROCK || '' }}
          AWS_REGION: ${{ steps.pick.outputs.provider == 'bedrock' && vars.BEDROCK_REGION || '' }}
          # code-review 플러그인의 하위 에이전트가 쓰는 별명을 고른 길의 모델 이름으로 바꾼다
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ steps.pick.outputs.provider == 'openrouter' && 'anthropic/claude-opus-5.5' || steps.pick.outputs.provider == 'bedrock' && vars.BEDROCK_OPUS_MODEL || '' }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ steps.pick.outputs.provider == 'openrouter' && 'anthropic/claude-sonnet-5.5' || steps.pick.outputs.provider == 'bedrock' && vars.BEDROCK_SONNET_MODEL || '' }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ steps.pick.outputs.provider == 'openrouter' && 'anthropic/claude-haiku-5.5' || steps.pick.outputs.provider == 'bedrock' && vars.BEDROCK_HAIKU_MODEL || '' }}
        with:
          anthropic_api_key: ${{ steps.pick.outputs.provider == 'openrouter' && secrets.OPENROUTER_API_KEY || '' }}
          claude_code_oauth_token: ${{ steps.pick.outputs.provider == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          use_bedrock: ${{ steps.pick.outputs.provider == 'bedrock' && 'true' || 'false' }}
          track_progress: true
          # 공식 문서 예시 그대로 — 마켓플레이스를 먼저 등록해야 플러그인 이름이 풀린다
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            /code-review:code-review high --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            리뷰를 시작하기 전에 docs/review-checklist.md 를 읽어라. 이 레포만의 규칙(가드레일 우회·중복 실행·
            사실 칸 오염·잠금 틈)이 거기 있고, 그 항목을 일반 버그보다 먼저 확인한다. 보고 형식도 그 파일을 따른다.
            모든 코멘트는 한국어로 남겨라.
            같은 PR 의 두 번째 리뷰부터는 새 커밋만 보고, 이미 단 코멘트를 반복하지 마라.
            확신이 없는 건 "확인 필요"로 표시해라. 칭찬이나 요약은 쓰지 마라 — 고칠 게 없으면 한 줄로 끝내라.
          # high: 검증 패스 포함 (찾은 것을 코드로 확인해 CONFIRMED/PLAUSIBLE 판정).
          # 고른 길의 모델 이름. 값을 줄이려면 sonnet 쪽 이름으로, 절반이다.
          claude_args: |
            --model ${{ steps.pick.outputs.provider == 'openrouter' && 'anthropic/claude-opus-5.5' || steps.pick.outputs.provider == 'bedrock' && vars.BEDROCK_OPUS_MODEL || 'opus' }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
