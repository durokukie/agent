# PR 자동 리뷰 — CodeRabbit 대체 (Free 플랜은 요약만 하고 줄 단위 지적을 안 한다).
#
# 인증: OPENROUTER_API_KEY. 2026-11-04부터 구독 OAuth 토큰 대신 OpenRouter로 호출한다. 시크릿은 레포마다 따로 등록한다.
#       토큰 수만큼 요금이 나가므로 키에 사용 한도를 걸어 둔다.
# 코멘트 게시: Claude GitHub App (https://github.com/apps/claude) 이 레포에 설치돼 있어야 한다.
#       `id-token: write` 는 그 App 토큰을 받기 위한 권한.
#
# 리뷰 본체는 Claude Code 의 code-review 플러그인 — /code-review 를 터미널에서 치는 것과 같다.
# --comment 로 인라인 코멘트를 단다.
name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore:               # 문서만 바뀐 PR 은 건너뛴다 — 요금 절약
      - "docs/**"
      - "**/*.md"

# 같은 PR 에 연달아 푸시하면 앞 리뷰를 취소한다 — 요금 낭비 방지
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          # 워크어라운드 (https://github.com/anthropics/claude-code-action/issues/1646):
          # code-review 플러그인이 리뷰를 백그라운드 에이전트로 돌리면 Action 이 완료 전에
          # 세션을 닫아 리뷰가 유실된다. 포그라운드 실행을 강제한다.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: 1
          # OpenRouter의 Anthropic 호환 주소. 키는 anthropic_api_key로 넘기면 x-api-key 헤더로 간다.
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          # code-review 플러그인의 하위 에이전트가 쓰는 별명을 OpenRouter 이름으로 바꾼다.
          ANTHROPIC_DEFAULT_OPUS_MODEL: anthropic/claude-opus-5.5
          ANTHROPIC_DEFAULT_SONNET_MODEL: anthropic/claude-sonnet-5.5
          ANTHROPIC_DEFAULT_HAIKU_MODEL: anthropic/claude-haiku-5.5
        with:
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          track_progress: true
          # 공식 문서 예시 그대로 — 마켓플레이스를 먼저 등록해야 플러그인 이름이 풀린다
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            /code-review:code-review high --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            리뷰를 시작하기 전에 docs/review-checklist.md 를 읽어라. 이 레포만의 규칙(가드레일 우회·중복 실행·
            사실 칸 오염·잠금 틈)이 거기 있고, 그 항목을 일반 버그보다 먼저 확인한다. 보고 형식도 그 파일을 따른다.
            모든 코멘트는 한국어로 남겨라.
            같은 PR 의 두 번째 리뷰부터는 새 커밋만 보고, 이미 단 코멘트를 반복하지 마라.
            확신이 없는 건 "확인 필요"로 표시해라. 칭찬이나 요약은 쓰지 마라 — 고칠 게 없으면 한 줄로 끝내라.
          # high: 검증 패스 포함 (찾은 것을 코드로 확인해 CONFIRMED/PLAUSIBLE 판정).
          # OpenRouter 모델 이름을 그대로 쓴다. 값을 줄이려면 anthropic/claude-sonnet-5.5, 절반이다.
          claude_args: |
            --model anthropic/claude-opus-5.5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
