name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

# Python 버전은 .python-version 하나에서 온다 (uv 가 읽어 없으면 받아 온다). uv 자체 버전은 여기와 Dockerfile 두 곳.
# setup-uv 는 v10 같은 큰 버전 태그를 내지 않아 릴리스 커밋으로 고정한다
env:
  SETUP_UV_VERSION: "0.12.23"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: ${{ env.SETUP_UV_VERSION }}
      - run: uv sync --locked
      - run: uv run python -m pytest

  # 배포 DB 는 Postgres 다 (kukie-electron deploy/ 컴포즈 · 팀 Aurora). 마이그레이션이 Postgres 에서도 같은 결과인지 —
  # SQLite 에서만 맞는 리비전을 못 넣게 (agent #67, DURO-110)
  migrations-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      KUKIE_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      # 테스트 모듈이 GITHUB_JOB(이 잡 이름)으로도, 이 변수로도 "URL 없이 전부 skip" 을 실패로 만든다 — 잡 이름을 바꿔도, env: 를 지워도 잡히게 둘 다
      KUKIE_REQUIRE_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: ${{ env.SETUP_UV_VERSION }}
      - run: uv sync --locked
      - run: uv run python -m pytest -q -ra tests/test_migrations_postgres.py

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KIND_VERSION: v0.32.0
      KUKIE_E2E_CONTEXT: kind-kukie-e2e
      KUKIE_MODEL: test
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: ${{ env.SETUP_UV_VERSION }}
      - run: uv sync --locked
      - name: Install kind
        run: |
          curl -fsSLO "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSLO "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64.sha256sum"
          sha256sum -c kind-linux-amd64.sha256sum
          sudo install -m 0755 kind-linux-amd64 /usr/local/bin/kind
      - run: kind create cluster --name kukie-e2e --wait 120s
      - run: uv run python -m pytest -q -m e2e
      - if: always()
        run: kind delete cluster --name kukie-e2e

  # develop 에 머지되고 위 검사가 모두 통과하면 개발환경 이미지를 구워 ECR kukie-agent 에 올린다.
  # 출입증: kukie-infra 의 kukie-dev-github-agent 역할 — 이 레포 develop 에서만, kukie-agent 창고에만 push 할 수 있다.
  # 레포 Variables 의 AWS_ROLE_ARN 이 그 역할이다. 창고가 IMMUTABLE 이라 태그는 dev-<커밋 SHA> 하나만 쓴다.
  # 버전은 kukie-manifest envs/dev/kustomization.yaml 의 digest 로 올린다 — 아래 알림 단계가 kukie-manifest 에 이 digest 를 알린다.
  image:
    if: github.event_name == 'push'
    needs: [test, migrations-postgres, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      REGISTRY: 320343233643.dkr.ecr.ap-northeast-2.amazonaws.com
      REPOSITORY: kukie-agent
      # 개발환경 이미지는 dev- 로 시작한다. kukie-infra 의 ECR 수명 규칙(적용 후)이 dev- 태그는 최근 push 4개만 남긴다(prod- 는 6개).
      TAG: dev-${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2
          allowed-account-ids: "320343233643"
      - name: Log in to ECR
        shell: bash
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
      # 같은 커밋으로 다시 돌리면 이미 있는 태그라 push 가 거부된다(IMMUTABLE). 있으면 굽지 않고 그 digest 를 쓴다.
      # 역할에 ecr:DescribeImages 가 없어서 BatchGetImage 로 확인한다. 받는 매니페스트 종류를 명시해야
      # buildx · attestation 으로 OCI image index 가 올라가도 "태그 없음" 으로 오판하지 않는다.
      - name: Build and push unless this commit is already in ECR
        id: push
        shell: bash
        run: |
          digest() {
            aws ecr batch-get-image --repository-name "$REPOSITORY" --image-ids imageTag="$TAG" \
              --accepted-media-types application/vnd.oci.image.index.v1+json application/vnd.oci.image.manifest.v1+json \
                application/vnd.docker.distribution.manifest.list.v2+json application/vnd.docker.distribution.manifest.v2+json \
              --query 'images[0].imageId.imageDigest' --output text
          }
          existing=$(digest)
          if [ "$existing" = "None" ]; then
            DOCKER_BUILDKIT=1 docker build --platform linux/amd64 -t "$REGISTRY/$REPOSITORY:$TAG" .
            docker push "$REGISTRY/$REPOSITORY:$TAG"
            # ECR 은 push 직후 조회가 늦게 보일 수 있다 — 간격을 늘려 가며 다시 본다 (push 뒤 0·2·6·14·30초, 최대 30초)
            for wait in 0 2 4 8 16; do
              sleep "$wait"
              existing=$(digest)
              [ "$existing" != "None" ] && break
            done
          else
            echo "이미 있는 태그 — 굽지 않는다"
          fi
          # 이 digest 를 요약에 적고 아래 알림 단계에 넘긴다 — 모양이 아니면 잡을 실패시킨다
          case "$existing" in
            sha256:*) ;;
            *) echo "digest 를 읽지 못했다: $existing" >&2; exit 1 ;;
          esac
          echo "### $REPOSITORY 이미지" >> "$GITHUB_STEP_SUMMARY"
          echo "- 태그: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- digest: \`$existing\` — develop HEAD 이면 아래 알림 단계가 kukie-manifest 에 보내는 값" >> "$GITHUB_STEP_SUMMARY"
          echo "digest=$existing" >> "$GITHUB_OUTPUT"
      # 개발환경 반영 알림 — kukie-manifest 에 image-pushed 이벤트를 보내면 그쪽 수신 워크플로가 envs/dev 의 digest 를 바꿔 커밋한다.
      # 먼저 develop 이 이 커밋보다 앞서 있는지 본다. 앞서 있으면 그 커밋의 실행이 알리므로 여기서는 건너뛴다 — 늦게 끝난 옛 실행이 새 digest 를 덮지 않게.
      # 건너뛰는 실행은 아래 토큰도 받지 않는다.
      - name: Check develop HEAD
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::develop 이 ${head:0:7} 로 앞서가 manifest 알림을 건너뛴다"
            echo "- manifest 알림 건너뜀: develop 이 \`${head:0:7}\` 로 앞서가 있다 — 그 커밋의 실행이 알린다" >> "$GITHUB_STEP_SUMMARY"
          fi
      # 신분: kukie-manifest 에만 설치된 GitHub App kukie-manifest-bot (Variables MANIFEST_APP_CLIENT_ID · Secrets MANIFEST_APP_PRIVATE_KEY).
      # dispatch 에는 Contents 쓰기가 필요해 그 권한 하나만 받는다. 이 잡은 develop push 에서만 돌아 비밀 값이 PR 실행에 닿지 않는다.
      - name: Get kukie-manifest bot token
        if: steps.guard.outputs.latest == 'true'
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MANIFEST_APP_CLIENT_ID }}
          private-key: ${{ secrets.MANIFEST_APP_PRIVATE_KEY }}
          owner: durokukie
          repositories: kukie-manifest
          permission-contents: write
      # 수신 워크플로는 kukie-manifest 기본 브랜치(main)에 있어야 이 이벤트로 돈다
      - name: Notify kukie-manifest
        if: steps.guard.outputs.latest == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          APP: kukie-agent
          DIGEST: ${{ steps.push.outputs.digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api repos/durokukie/kukie-manifest/dispatches \
            -f event_type=image-pushed \
            -f "client_payload[app]=$APP" \
            -f "client_payload[digest]=$DIGEST" \
            -f "client_payload[source_repo]=$GITHUB_REPOSITORY" \
            -f "client_payload[source_sha]=$GITHUB_SHA" \
            -f "client_payload[run_url]=$RUN_URL"
          echo "- manifest 알림 보냄 — 반영은 [kukie-manifest Actions](https://github.com/durokukie/kukie-manifest/actions?query=event%3Arepository_dispatch) 에서 확인" >> "$GITHUB_STEP_SUMMARY"
