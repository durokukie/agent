version: 1

fallback:
  parse_error: review_required
  no_match: review_required
  dynamic_argument: review_required

rules:
  - id: GET-BASE
    description: 일반 리소스 조회
    risk: safe
    match: {verb: get, sensitive_output: false}

  - id: GET-ALLNS
    description: 전체 네임스페이스 조회
    risk: safe
    match: {verb: get, sensitive_output: false, flags_any: [--all-namespaces]}

  - id: GET-WATCH
    description: 리소스 변경 감시
    risk: safe
    match: {verb: get, sensitive_output: false, flags_any: [--watch]}

  - id: DESCRIBE
    description: 리소스 상세 조회
    risk: safe
    match: {verb: describe}

  - id: LOGS
    description: 컨테이너 로그 조회
    risk: safe
    match: {verb: logs}

  - id: CONFIG-READ
    description: 로컬 kubeconfig 조회
    risk: safe
    match:
      verb: config
      subcommand: [get-contexts, current-context, view]

  - id: APPLY
    description: 실제 리소스 적용
    risk: caution
    match: {verb: apply, dry_run: none}

  - id: CONFIG-SWITCH
    description: 기본 context 또는 namespace 변경
    risk: caution
    match:
      verb: config
      subcommand: [use-context, set-context]

  - id: DELETE-POD
    description: Pod 삭제
    risk: destructive
    match: {verb: delete, resource: pod}

  - id: DELETE-POD-NOW
    description: Pod 즉시 삭제
    risk: destructive
    match:
      verb: delete
      resource: pod
      options: {--grace-period: "0"}

  - id: DELETE-DEPLOYMENT
    description: Deployment 삭제
    risk: destructive
    match: {verb: delete, resource: deployment}
