# Kukie 위험도 룰셋 v0.1 — ⚠️ 초안: k8s 운영 경험자 리뷰 필수 (상상 금지 구역)
# 축 4개: verb / kind / namespace / flags. 조건 안 쓴 축은 "아무거나".
# 매칭 안 되면 fail-closed → destructive (rules.py)

rules:
  - id: R-01
    desc: 삭제는 기본 destructive
    match: { verb: delete }
    risk: destructive

  - id: R-02
    desc: 보호 네임스페이스에 대한 모든 변경
    match: { namespace: [kube-system, kube-public, kube-node-lease] }
    risk: destructive

  - id: R-03
    desc: 강제 삭제 플래그
    match: { flags: ["--force", "--grace-period=0"] }
    risk: destructive

  - id: R-04
    desc: 전체 대상 삭제
    match: { verb: delete, flags: ["--all"] }
    risk: destructive

  - id: R-10
    desc: 일반 변경 작업
    match: { verb: [apply, scale, rollout] }
    risk: caution

  - id: R-20
    desc: cluster-scoped 리소스 변경
    match: { kind: [namespace, clusterrole, clusterrolebinding, node] }
    risk: destructive
