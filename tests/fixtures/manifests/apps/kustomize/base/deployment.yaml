apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app: api}
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: public.ecr.aws/docker/library/nginx:1.28-alpine
          ports:
            - containerPort: 80
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
