apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {app: web}
spec:
  replicas: 4
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: public.ecr.aws/docker/library/nginx:1.28-alpine
          ports:
            - containerPort: 80
          env:
            - name: GREETING
              value: hello
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
