[project]
name = "kukie"
version = "0.1.0"
description = "쿠버네티스를 배우면서 안전하게 쓰는 에이전트"
requires-python = ">=3.10"
dependencies = [
    "pydantic-ai>=2.16",
    "tenacity>=8.0",        # pydantic_ai.retries — 모델 HTTP 재시도 (DURO-66)
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",      # 채팅방·run 저장 (kukie/store)
    "alembic>=1.13",        # 표 모양 변경 이력 — 켜질 때 적용 (kukie/store/migrations, issue #67)
    "httpx>=0.27",          # Spring 회원 서버 /users/me 호출 (kukie/auth)
    "cryptography>=42",     # 클러스터 자격증명 대칭 암호화 (kukie/clusters, 기획 04 §8)
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio", "httpx>=0.27"]

[project.scripts]
kukie = "kukie.cli:main"

[tool.pytest.ini_options]
markers = ["e2e: requires an explicit disposable kind context"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
