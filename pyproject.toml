[project]
name = "kukie-agent"
version = "0.1.0"
description = "쿠버네티스를 배우면서 안전하게 쓰는 에이전트"
requires-python = ">=3.14"
dependencies = [
    "pydantic-ai>=2.16",
    "tenacity>=8.0",        # pydantic_ai.retries — 모델 HTTP 재시도 (DURO-66)
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "httpx>=0.27",          # Kukie API 서버(kukie-server) — /users/me 인증(kukie_agent/auth)과 /internal 저장 API(kukie_agent/server_api). agent 는 DB 가 없다
    "anyio>=4.0",           # 블로킹 kubectl 을 스레드로 + 쓰임새별 상한 (kukie_agent/kubectl/runner.thread_limiter). 원래 FastAPI·httpx 가 끌어오지만 직접 import 한다
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio"]   # uv sync 가 기본으로 같이 깐다

[tool.uv]
required-version = ">=0.12"

[project.scripts]
kukie = "kukie_agent.cli:main"

[tool.pytest.ini_options]
markers = ["e2e: requires an explicit disposable kind context"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
