[project]
name = "kukie-agent"
version = "0.1.0"
description = "쿠버네티스를 배우면서 안전하게 쓰는 에이전트"
requires-python = ">=3.14"
dependencies = [
    "pydantic-ai>=2.16",
    "tenacity>=8.0",        # pydantic_ai.retries — 모델 HTTP 재시도 (DURO-66)
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",      # 채팅방·run 저장 (kukie_agent/store)
    "alembic>=1.13",        # 표 모양 변경 이력 — 켜질 때 적용 (kukie_agent/store/migrations, issue #67)
    "httpx>=0.27",          # Spring 회원 서버 /users/me 호출 (kukie_agent/auth)
    "cryptography>=42",     # 클러스터 자격증명 대칭 암호화 (kukie_agent/clusters, 기획 04 §8)
    "anyio>=4.0",           # 블로킹 kubectl 을 스레드로 + 쓰임새별 상한 (kukie_agent/kubectl/runner.thread_limiter). 원래 FastAPI·httpx 가 끌어오지만 직접 import 한다
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]   # KUKIE_DATABASE_URL 을 Postgres 로 줄 때 — 이미지와 CI postgres 잡

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio", "kukie-agent[postgres]"]   # uv sync 가 기본으로 같이 깐다

[tool.uv]
required-version = ">=0.12"

[project.scripts]
kukie = "kukie_agent.cli:main"

[tool.pytest.ini_options]
markers = ["e2e: requires an explicit disposable kind context"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
